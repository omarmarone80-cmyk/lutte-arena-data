<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Lutte SN · L'Arène des Champions</title>
    <link rel="manifest" href="/lutte-arena-data/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f5c3f; --primary-light: #1a8c5c; --accent: #f59e0b;
            --bg: #f8fafc; --surface: #ffffff; --text: #1e293b;
            --text-secondary: #64748b; --border: #f1f5f9;
            --gradient-hero: linear-gradient(135deg, #0f5c3f 0%, #1a8c5c 50%, #0d9488 100%);
            --gradient-card: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            --gradient-accent: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04); --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1); --shadow-glow: 0 0 30px rgba(15,92,63,0.15);
            --radius-sm: 12px; --radius-md: 20px; --radius-lg: 28px; --radius-xl: 36px;
            --avatar-colors: #0f5c3f, #1a8c5c, #0d9488, #d97706, #dc2626, #7c3aed, #2563eb, #059669;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text); padding-bottom: 20px;
            opacity: 0; animation: fadeIn 0.4s ease-out forwards;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes fadeIn{to{opacity:1;}}
        @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
        @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
        @keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(15,92,63,0.2);}50%{box-shadow:0 0 40px rgba(15,92,63,0.4);}}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

        /* REFRESH INDICATOR */
        .refresh-indicator{position:fixed;top:0;left:0;width:100%;height:0;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;transition:height 0.3s cubic-bezier(0.25,0.8,0.25,1.2);overflow:hidden;z-index:500;}
        .refresh-indicator.pulling{height:56px;}
        .refresh-indicator.refreshing{height:56px;background:var(--primary-light);}
        .refresh-spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:12px;}

        /* DRAWER */
        .drawer{position:fixed;top:0;left:-300px;width:300px;height:100%;background:var(--surface);z-index:2000;transition:left 0.35s cubic-bezier(0.25,0.8,0.25,1);box-shadow:var(--shadow-lg);border-radius:0 24px 24px 0;}
        .drawer.open{left:0;}
        .drawer-header{background:var(--gradient-hero);padding:40px 28px 32px;color:#fff;border-radius:0 24px 0 0;}
        .drawer-header .logo-text{font-size:28px;font-weight:800;letter-spacing:-0.5px;}
        .drawer-header p{font-size:13px;opacity:0.85;margin-top:6px;font-weight:500;}
        .drawer-menu{list-style:none;padding:12px 0;}
        .drawer-menu li a{display:flex;align-items:center;gap:16px;padding:16px 28px;color:var(--text);text-decoration:none;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;border-radius:0 12px 12px 0;margin:4px 8px 4px 0;}
        .drawer-menu li a:active{background:#f1f5f9;color:var(--primary);transform:translateX(4px);}
        .drawer-menu .icon-circle{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#f1f5f9;}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,30,20,0.5);backdrop-filter:blur(4px);z-index:1999;display:none;}
        .overlay.show{display:block;}

        /* HEADER */
        .menu-btn{position:fixed;top:20px;left:20px;width:48px;height:48px;background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:101;font-size:22px;color:var(--text);box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,0.6);}
        .menu-btn:active{background:#fff;transform:scale(0.95);}
        .header{padding:20px 60px 16px;text-align:center;background:transparent;position:relative;}
        .header h1{font-size:26px;font-weight:800;background:var(--gradient-hero);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;}
        .sous-titre{font-size:12px;color:var(--text-secondary);font-weight:500;margin-top:2px;letter-spacing:2px;text-transform:uppercase;}
        .header-icons{position:absolute;top:20px;right:20px;display:flex;gap:10px;}
        .icon-btn{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.6);font-size:18px;cursor:pointer;padding:12px;border-radius:16px;color:var(--text);box-shadow:var(--shadow-sm);transition:all 0.2s;}
        .icon-btn:active{background:#fff;transform:scale(0.94);box-shadow:var(--shadow-md);}

        /* TABS */
        .tabs-container{padding:0 16px;margin-bottom:8px;}
        .tabs{display:flex;background:var(--surface);padding:6px;gap:4px;border-radius:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
        .tab{flex:1;text-align:center;padding:14px 8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--text-secondary);border-radius:16px;transition:all 0.3s cubic-bezier(0.25,0.8,0.25,1);position:relative;z-index:1;}
        .tab.active{color:#fff;background:var(--gradient-hero);box-shadow:var(--shadow-glow);font-weight:700;}
        .tab:not(.active):active{background:#f8fafc;}

        /* PAGES */
        .page{display:none;animation:slideUp 0.4s ease-out;}
        .page.active-page{display:block;}

        /* AVATAR STYLES */
        .avatar-placeholder{
            width:100%;height:100%;display:flex;align-items:center;justify-content:center;
            font-weight:700;color:#fff;text-transform:uppercase;font-size:inherit;
            background:var(--avatar-bg, var(--gradient-hero));
        }
        .avatar-circle{
            border-radius:50%;overflow:hidden;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
        }
        .avatar-initials{font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.2);}

        /* COMBAT CARD */
        .combat-list{padding:8px 0;}
        .combat-item-card{background:var(--gradient-card);margin:14px 16px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-md);transition:all 0.3s;animation:slideUp 0.5s ease-out backwards;}
        .combat-item-card:active{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
        .combat-preview{padding:20px;cursor:pointer;position:relative;}
        .combat-preview:active{background:rgba(248,250,252,0.8);}
        .combat-date{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .date-badge{font-size:12px;font-weight:700;color:var(--primary);background:#e8f5ed;padding:6px 16px;border-radius:20px;letter-spacing:0.5px;}
        .date-badge.international{background:#fef3c7;color:#d97706;}
        .combat-lieu{font-size:13px;color:var(--text-secondary);margin-bottom:16px;font-weight:500;display:flex;align-items:center;gap:6px;}
        .combat-lieu::before{content:"📍";font-size:14px;}
        .combat-teams{display:flex;align-items:center;justify-content:space-between;gap:20px;}
        .team{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;}
        .team-photo{
            width:75px;height:75px;border-radius:50%;
            background:linear-gradient(135deg,#e8f5ed,#d1fae5);
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;border:3px solid #fff;
            box-shadow:var(--shadow-md);transition:all 0.3s;
            font-size:24px;
        }
        .team-photo:hover{box-shadow:var(--shadow-glow);transform:scale(1.04);}
        .team-photo img{width:100%;height:100%;object-fit:cover;}
        .team-name{font-weight:700;font-size:15px;text-align:center;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all 0.2s;}
        .team-name:active{color:var(--primary);background:#f1f5f9;}
        .team-ecurie{font-size:11px;color:var(--primary);font-weight:600;opacity:0.8;}
        .vs-badge{background:var(--gradient-accent);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 4px 15px rgba(245,158,11,0.3);flex-shrink:0;}
        .share-btn{background:transparent;border:none;cursor:pointer;padding:10px;border-radius:14px;font-size:18px;transition:all 0.2s;}
        .share-btn:active{background:#f1f5f9;transform:scale(0.9);}

        /* PETITS COMBATS */
        .petits-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;background:#f8fafc;border-top:1px solid var(--border);transition:all 0.2s;}
        .petits-header:active{background:#f1f5f9;}
        .petits-title{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;display:flex;align-items:center;gap:8px;letter-spacing:1px;}
        .toggle-arrow{font-size:14px;color:var(--primary);transition:transform 0.3s cubic-bezier(0.25,0.8,0.25,1);}
        .toggle-arrow.rotated{transform:rotate(180deg);}
        .petits-combats-list{padding:0 20px 18px;display:none;}
        .petits-combats-list.open{display:block;animation:slideUp 0.3s ease-out;}
        .petit-combat-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:12px;}
        .petit-lutteur{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;padding:6px;border-radius:10px;transition:all 0.2s;}
        .petit-lutteur:active{background:#f8fafc;}
        .petit-photo{
            width:40px;height:40px;border-radius:50%;
            background:#e8f5ed;display:flex;align-items:center;
            justify-content:center;overflow:hidden;flex-shrink:0;
            border:2px solid #fff;box-shadow:var(--shadow-sm);
            font-size:15px;
        }
        .petit-photo img{width:100%;height:100%;object-fit:cover;}
        .petit-nom{font-size:14px;font-weight:600;}
        .petit-vs{background:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;color:var(--accent);border:1px solid #fef3c7;}

        /* PAGE DÉTAIL */
        .detail-page{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:1000;overflow-y:auto;transform:translateX(102%);transition:transform 0.4s cubic-bezier(0.25,0.8,0.25,1);}
        .detail-page.open{transform:translateX(0);}
        .detail-header{background:var(--gradient-hero);padding:20px;color:#fff;position:sticky;top:0;z-index:10;}
        .detail-back{background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:22px;width:44px;height:44px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
        .detail-back:active{background:rgba(255,255,255,0.4);transform:scale(0.94);}
        .detail-info{background:var(--surface);margin:16px;border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
        .section-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

        /* FICHE LUTTEUR - STICKY NAV */
        .fiche-sticky-nav{
            position:sticky;top:0;z-index:9;
            background:var(--gradient-hero);padding:12px 20px;
            display:flex;align-items:center;gap:16px;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
            transition:all 0.3s;
        }
        .fiche-sticky-photo{
            width:50px;height:50px;border-radius:50%;
            border:2px solid rgba(255,255,255,0.6);
            overflow:hidden;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,0.2);
            font-size:18px;color:#fff;
        }
        .fiche-sticky-photo img{width:100%;height:100%;object-fit:cover;}
        .fiche-sticky-info{flex:1;min-width:0;}
        .fiche-sticky-nom{font-weight:700;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .fiche-sticky-ecurie{font-size:11px;color:rgba(255,255,255,0.8);}
        .fiche-sticky-back{
            background:rgba(255,255,255,0.2);border:none;color:#fff;
            font-size:18px;width:38px;height:38px;border-radius:12px;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            flex-shrink:0;transition:all 0.2s;
        }
        .fiche-sticky-back:active{background:rgba(255,255,255,0.4);}

        /* FICHE HERO */
        .fiche-photo-full{
            width:100%;height:320px;
            background:var(--gradient-hero);
            display:flex;align-items:center;justify-content:center;
            position:relative;
        }
        .fiche-photo-full img{
            width:170px;height:170px;border-radius:50%;
            object-fit:cover;border:5px solid #fff;
            box-shadow:0 8px 40px rgba(0,0,0,0.3);
        }
        .fiche-avatar-large{
            width:170px;height:170px;border-radius:50%;
            border:5px solid #fff;box-shadow:0 8px 40px rgba(0,0,0,0.3);
            display:flex;align-items:center;justify-content:center;
            font-size:70px;font-weight:800;color:#fff;
            background:rgba(255,255,255,0.2);
        }
        .fiche-nom-overlay{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;}
        .fiche-nom-overlay h2{font-size:26px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,0.3);}
        .fiche-nom-overlay p{font-size:16px;opacity:0.9;margin-top:6px;}

        /* COMBATANTS DÉTAIL */
        .detail-combatants{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:12px;padding:0 10px;}
        .detail-team{flex:1;text-align:center;cursor:pointer;transition:all 0.3s;}
        .detail-team:active{transform:scale(0.96);}
        .detail-photo{
            width:90px;height:90px;border-radius:50%;
            background:rgba(255,255,255,0.2);margin:0 auto 12px;
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;border:4px solid rgba(255,255,255,0.5);
            box-shadow:0 8px 30px rgba(0,0,0,0.2);
            font-size:36px;color:#fff;
        }
        .detail-photo img{width:100%;height:100%;object-fit:cover;}
        .detail-name{font-size:17px;font-weight:700;color:#fff;}
        .detail-ecurie{font-size:11px;opacity:0.85;margin-top:4px;font-weight:500;}
        .detail-vs{background:rgba(255,255,255,0.25);backdrop-filter:blur(8px);padding:8px 18px;border-radius:30px;font-weight:800;font-size:18px;color:#fff;border:1px solid rgba(255,255,255,0.3);}

        /* PRONOSTICS */
        .pronostics-section{background:var(--surface);margin:16px;border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
        .pronostic-bar{margin-bottom:18px;}
        .pronostic-nom{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:8px;}
        .pronostic-track{height:28px;background:#f1f5f9;border-radius:14px;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);}
        .pronostic-fill{height:100%;border-radius:14px;transition:width 1s cubic-bezier(0.25,0.8,0.25,1);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:12px;font-weight:700;color:#fff;}
        .pronostic-fill.lutteur1{background:linear-gradient(90deg,#0f5c3f,#1a8c5c);}
        .pronostic-fill.lutteur2{background:linear-gradient(90deg,#f59e0b,#d97706);}
        .vote-buttons{display:flex;gap:12px;margin-top:16px;}
        .vote-btn{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;flex:1;text-align:center;color:var(--text-secondary);transition:all 0.3s cubic-bezier(0.25,0.8,0.25,1);}
        .vote-btn:active{transform:scale(0.96);}
        .vote-btn.voted{background:#e8f5ed;border-color:var(--primary);color:var(--primary);box-shadow:var(--shadow-glow);}

        /* COMMENTAIRES */
        .commentaires-section{background:var(--surface);margin:16px;border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
        .comment-form{display:flex;gap:10px;margin-bottom:18px;}
        .comment-input{flex:1;padding:14px 16px;border:2px solid #e2e8f0;border-radius:16px;font-size:14px;outline:none;font-family:inherit;transition:all 0.3s;}
        .comment-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,92,63,0.1);}
        .comment-submit{background:var(--gradient-hero);color:#fff;border:none;border-radius:16px;padding:14px 22px;font-weight:700;cursor:pointer;font-size:14px;transition:all 0.3s;font-family:inherit;}
        .comment-submit:active{transform:scale(0.95);opacity:0.9;}
        .comment-card{background:#f8fafc;padding:16px;border-radius:16px;margin-bottom:10px;border-left:4px solid var(--primary);}
        .comment-author{font-weight:700;font-size:14px;color:var(--primary);}
        .comment-date{font-size:11px;color:var(--text-secondary);margin-left:8px;}

        /* LUTTEURS CARDS */
        .lutteur-card{background:var(--gradient-card);margin:14px 16px;border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);display:flex;align-items:center;gap:20px;cursor:pointer;box-shadow:var(--shadow-md);transition:all 0.3s;}
        .lutteur-card:active{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
        .lutteur-photo-card{
            width:90px;height:90px;border-radius:50%;
            background:linear-gradient(135deg,#e8f5ed,#d1fae5);
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;flex-shrink:0;
            border:3px solid #fff;box-shadow:var(--shadow-md);
            font-size:35px;
        }
        .lutteur-photo-card img{width:100%;height:100%;object-fit:cover;}
        .lutteur-infos{flex:1;}
        .lutteur-nom{font-weight:700;font-size:19px;color:var(--text);}
        .lutteur-ecurie{font-size:13px;color:var(--primary);margin-top:4px;font-weight:600;}
        .lutteur-stats{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--text-secondary);font-weight:500;}

        /* STAT GRID */
        .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;}
        .stat-item{background:#f8fafc;padding:16px 8px;border-radius:16px;}
        .stat-value{font-size:22px;font-weight:800;color:var(--primary);}
        .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;font-weight:500;}

        /* HISTORIQUE */
        .historique-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;flex-wrap:wrap;}
        .historique-date{font-size:12px;color:var(--text-secondary);min-width:75px;font-weight:500;}
        .historique-adversaire{font-weight:600;flex:1;}
        .resultat-badge{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;}
        .resultat-badge.victoire{background:#e8f5ed;color:#0f5c3f;}
        .resultat-badge.defaite{background:#fee2e2;color:#dc2626;}
        .resultat-badge.nul{background:#fef3c7;color:#d97706;}

        /* NEWS CARDS */
        .news-card{background:var(--surface);margin:14px 16px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-md);}
        .news-image{width:100%;height:200px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .news-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
        .news-card:hover .news-image img{transform:scale(1.03);}
        .news-content{padding:20px;}
        .news-title{font-weight:700;font-size:18px;color:var(--text);margin-bottom:8px;}
        .news-date{font-size:12px;color:var(--text-secondary);margin-bottom:12px;font-weight:500;}
        .news-excerpt{font-size:14px;color:#475569;margin-bottom:12px;line-height:1.6;}
        .news-full{display:none;font-size:14px;color:#475569;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);line-height:1.6;}
        .read-more{background:#f1f5f9;border:none;padding:10px 20px;border-radius:20px;color:var(--primary);font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.2s;}
        .read-more:active{background:#e8f5ed;}

        /* MBAPATT */
        .mbapatt-participants{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
        .participant-tag{background:#f1f5f9;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text);}

        /* SEARCH OVERLAY */
        .search-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,30,20,0.6);backdrop-filter:blur(8px);z-index:3000;display:none;flex-direction:column;}
        .search-overlay.open{display:flex;}
        .search-header{padding:20px;display:flex;gap:12px;align-items:center;}
        .search-input-popup{flex:1;padding:16px 20px;border-radius:20px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.95);font-size:16px;outline:none;font-family:inherit;}
        .search-close{background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:24px;width:50px;height:50px;border-radius:16px;cursor:pointer;}
        .search-results{flex:1;overflow-y:auto;padding:0 16px 20px;}
        .search-result-item{background:var(--surface);padding:16px 20px;border-radius:16px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;}
        .search-result-item:active{transform:scale(0.98);background:#f8fafc;}

        /* CALENDAR OVERLAY */
        .calendar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,30,20,0.6);backdrop-filter:blur(8px);z-index:3000;display:none;align-items:center;justify-content:center;}
        .calendar-card{background:var(--surface);border-radius:var(--radius-xl);padding:32px;text-align:center;width:85%;max-width:360px;box-shadow:var(--shadow-lg);}
        .calendar-date{font-size:40px;font-weight:800;color:var(--primary);}
        .calendar-day{font-size:18px;color:var(--text-secondary);margin-top:4px;}
        .calendar-close{background:var(--gradient-hero);color:#fff;border:none;padding:14px 28px;border-radius:20px;font-weight:700;margin-top:20px;cursor:pointer;font-family:inherit;}

        /* ADMIN BUTTON */
        .admin-link{position:fixed;bottom:24px;right:24px;width:52px;height:52px;background:var(--gradient-hero);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:var(--shadow-lg);z-index:100;cursor:pointer;opacity:0.4;transition:all 0.3s;}
        .admin-link:active{opacity:0.8;transform:scale(1.05);}

        /* FOOTER */
        footer{text-align:center;font-size:12px;color:var(--text-secondary);padding:24px;font-weight:500;}

        /* SKELETON */
        .skeleton-card{background:var(--surface);margin:14px 16px;border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);}
        .skeleton-line{height:16px;background:linear-gradient(90deg,#e8edf2 25%,#f1f5f9 50%,#e8edf2 75%);background-size:200% 100%;animation:shimmer 1.8s infinite;border-radius:8px;margin-bottom:14px;}

        /* EMPTY STATE */
        .empty-message{text-align:center;padding:60px 20px;color:var(--text-secondary);font-weight:500;}
        .empty-icon{font-size:50px;margin-bottom:16px;}

        /* BUTTONS */
        .btn-primary{background:var(--gradient-hero);color:#fff;border:none;border-radius:16px;padding:16px 24px;font-weight:700;cursor:pointer;font-family:inherit;font-size:15px;width:100%;transition:all 0.3s;box-shadow:var(--shadow-md);}
        .btn-primary:active{transform:scale(0.97);opacity:0.9;}
    </style>
</head>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const APP_VERSION = '5.1.0';
const CONFIG = { 
    DATA_URL: 'https://omarmarone80-cmyk.github.io/lutte-arena-data/',
    VERSION: Date.now()  // Force le rechargement à chaque visite
};

if (localStorage.getItem('app_version') !== APP_VERSION) {
    localStorage.clear();
    if ('caches' in window) caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
    localStorage.setItem('app_version', APP_VERSION);
}

let areneData = [], lutteursData = {}, newsData = [], mbapattData = [], photos = {};

// ============================================================
// GÉNÉRATEUR D'AVATAR STYLISÉ
// ============================================================
function getAvatarColor(name) {
    const colors = ['#0f5c3f', '#1a8c5c', '#0d9488', '#d97706', '#dc2626', '#7c3aed', '#2563eb', '#059669', '#b45309', '#be123c'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return colors[Math.abs(hash) % colors.length];
}

function getInitials(name) {
    if (!name || name === "A confirmer") return "?";
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) {
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }
    return name.substring(0, 2).toUpperCase();
}

function generateAvatarHTML(name, sizeClass = '') {
    const initials = getInitials(name);
    const bgColor = getAvatarColor(name);
    return `<div class="avatar-placeholder" style="background:${bgColor};width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><span class="avatar-initials" style="font-size:inherit;">${initials}</span></div>`;
}

// ============================================================
// HELPERS PHOTOS (avec fallback avatar)
// ============================================================
function getPhotoHtml(l){
    if(!l||l==="A confirmer") return '<div class="team-photo" style="font-size:22px;">?</div>';
    let u = photos[l];
    if(u) return `<div class="team-photo"><img src="${u}" alt="${l}" loading="lazy" onerror="this.parentElement.innerHTML='${generateAvatarHTML(l).replace(/"/g, '&quot;')}';"></div>`;
    return `<div class="team-photo" style="font-size:24px;">${generateAvatarHTML(l)}</div>`;
}

function getPetitPhoto(l){
    if(!l||l==="A confirmer") return '<div class="petit-photo" style="font-size:16px;">?</div>';
    let u = photos[l];
    if(u) return `<div class="petit-photo"><img src="${u}" alt="${l}" loading="lazy" onerror="this.parentElement.innerHTML='${generateAvatarHTML(l).replace(/"/g, '&quot;')}';"></div>`;
    return `<div class="petit-photo" style="font-size:15px;">${generateAvatarHTML(l)}</div>`;
}

function getDetailPhoto(l){
    if(!l) return '<div class="detail-photo" style="font-size:40px;">?</div>';
    let u = photos[l];
    if(u) return `<div class="detail-photo"><img src="${u}" alt="${l}" loading="lazy" onerror="this.parentElement.innerHTML='${generateAvatarHTML(l).replace(/"/g, '&quot;')}';"></div>`;
    return `<div class="detail-photo" style="font-size:36px;">${generateAvatarHTML(l)}</div>`;
}

function getFicheAvatarLarge(nom) {
    let u = photos[nom];
    if(u) return `<img src="${u}" alt="${nom}" onerror="this.parentElement.innerHTML='<div class=\\'fiche-avatar-large\\'>${getInitials(nom)}</div>';">`;
    return `<div class="fiche-avatar-large" style="background:${getAvatarColor(nom)};">${getInitials(nom)}</div>`;
}

function getStickyAvatar(nom) {
    let u = photos[nom];
    if(u) return `<img src="${u}" alt="${nom}" onerror="this.parentElement.innerHTML='<span class=\\'avatar-initials\\' style=\\'font-size:18px;\\'>${getInitials(nom)}</span>';">`;
    return `<span class="avatar-initials" style="font-size:18px;">${getInitials(nom)}</span>`;
}

function formaterDate(j){
    if(!j.date) return j.jourSemaine || 'Date à confirmer';
    if(j.date.includes("??")) return j.jourSemaine;
    try {
        let p = j.date.split('-');
        let m = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
        return `${j.jourSemaine} ${parseInt(p[2])} ${m[parseInt(p[1])-1]}`;
    } catch(e) { return j.jourSemaine; }
}

// ============================================================
// CHARGEMENT DES DONNÉES
// ============================================================
async function rafraichirDonnees() {
    try {
        const t = Date.now();
        const [combatsRes, lutteursRes, newsRes, mbapattRes] = await Promise.all([
            fetch(CONFIG.DATA_URL + 'data/combats.json?v==' + t),
            fetch(CONFIG.DATA_URL + 'data/lutteurs.json?v=' + t),
            fetch(CONFIG.DATA_URL + 'data/news.json?v=' + t),
            fetch(CONFIG.DATA_URL + 'data/mbapatt.json?v=' + t).catch(() => ({ json: () => [] }))
        ]);
        areneData = await combatsRes.json();
        lutteursData = await lutteursRes.json();
        newsData = await newsRes.json();
        mbapattData = await mbapattRes.json();
        photos = {};
        for (let n in lutteursData) {
            if (lutteursData[n].photo) photos[n] = CONFIG.DATA_URL + lutteursData[n].photo;
        }
        afficherCombats(); afficherLutteurs(); afficherNews(); afficherMbapatt();
        try {
            localStorage.setItem('lutte_arena_cache', JSON.stringify({areneData, lutteursData, newsData, mbapattData, photos}));
        } catch(e) {}
        return true;
    } catch(e) {
        console.log('Erreur chargement données:', e);
        return false;
    }
}

async function chargerDonnees() {
    const c = localStorage.getItem('lutte_arena_cache');
    if(c){
        try {
            const d = JSON.parse(c);
            areneData = d.areneData || [];
            lutteursData = d.lutteursData || {};
            newsData = d.newsData || [];
            mbapattData = d.mbapattData || [];
            photos = d.photos || {};
            afficherCombats(); afficherLutteurs(); afficherNews(); afficherMbapatt();
        } catch(e) {}
    }
    await rafraichirDonnees();
    const loader = document.getElementById('loadingOverlay');
    if(loader) loader.remove();
}

// ============================================================
// AFFICHAGE COMBATS
// ============================================================
function afficherCombats(){
    const c = document.getElementById('arene-container'); if(!c) return;
    if(!areneData.length){ c.innerHTML='<div class="empty-message"><div class="empty-icon">🗓️</div>Aucun combat programmé</div>'; return; }
    let h = '';
    for(let i = 0; i < areneData.length; i++) {
        h += genererCarteCombat(areneData[i], i);
    }
    c.innerHTML = h;
}

function genererCarteCombat(c, i){
    let bc = c.estInternational ? 'international' : '';
    let bt = formaterDate(c);
    let pl = '';
    if(c.petitsCombats && c.petitsCombats.length){
        for(let p of c.petitsCombats){
            if(!p.lutteur1 || p.lutteur1 === "A confirmer") {
                pl += `<div class="petit-combat-row"><div style="text-align:center;width:100%;color:var(--text-secondary);font-weight:500;">📅 À confirmer</div></div>`;
            } else {
                pl += `<div class="petit-combat-row">
                    <div class="petit-lutteur" onclick="event.stopPropagation();ouvrirFicheLutteur('${p.lutteur1.replace(/'/g, "\\'")}')">${getPetitPhoto(p.lutteur1)}<span class="petit-nom">${p.lutteur1}</span></div>
                    <span class="petit-vs">VS</span>
                    <div class="petit-lutteur" onclick="event.stopPropagation();ouvrirFicheLutteur('${p.lutteur2.replace(/'/g, "\\'")}')"><span class="petit-nom">${p.lutteur2}</span>${getPetitPhoto(p.lutteur2)}</div>
                </div>`;
            }
        }
    } else {
        pl = `<div class="petit-combat-row"><div style="text-align:center;width:100%;color:var(--text-secondary);font-weight:500;">📅 À confirmer</div></div>`;
    }
    return `<div class="combat-item-card">
        <div class="combat-preview" onclick="openDetailPage(${i})">
            <div class="combat-date"><span class="date-badge ${bc}">${bt}</span><button class="share-btn" onclick="event.stopPropagation();partagerCombat(areneData[${i}],event)">📤</button></div>
            <div class="combat-lieu">${c.lieu||'Lieu à confirmer'}</div>
            <div class="combat-teams">
                <div class="team">${getPhotoHtml(c.vedette.lutteur1)}<div class="team-name" onclick="event.stopPropagation();ouvrirFicheLutteur('${c.vedette.lutteur1.replace(/'/g, "\\'")}')">${c.vedette.lutteur1}</div><div class="team-ecurie">${c.vedette.ecurie1||''}</div></div>
                <div class="vs-badge">VS</div>
                <div class="team">${getPhotoHtml(c.vedette.lutteur2)}<div class="team-name" onclick="event.stopPropagation();ouvrirFicheLutteur('${c.vedette.lutteur2.replace(/'/g, "\\'")}')">${c.vedette.lutteur2}</div><div class="team-ecurie">${c.vedette.ecurie2||''}</div></div>
            </div>
        </div>
        <div class="petits-header" onclick="event.stopPropagation();togglePetitsCombats(${i})">
            <div class="petits-title">🥊 Petits combats</div>
            <div class="toggle-arrow" id="arrow-${i}">▼</div>
        </div>
        <div class="petits-combats-list" id="petits-list-${i}">${pl}</div>
    </div>`;
}

// ============================================================
// PAGE DÉTAIL COMBAT
// ============================================================
function openDetailPage(idx){
    let c = areneData[idx]; if(!c) return;
    let combatId = `combat_${idx}`;
    let pronostics = JSON.parse(localStorage.getItem(`pronostics_${combatId}`) || '{"lutteur1":0,"lutteur2":0}');
    let totalPronos = pronostics.lutteur1 + pronostics.lutteur2 || 1;
    let pct1 = Math.round((pronostics.lutteur1 / totalPronos) * 100);
    let pct2 = Math.round((pronostics.lutteur2 / totalPronos) * 100);
    let userVote = localStorage.getItem(`vote_${combatId}`);

    let petitsHtml = '';
    if(c.petitsCombats && c.petitsCombats.length){
        petitsHtml = c.petitsCombats.map(p => {
            if(!p.lutteur1||p.lutteur1==="A confirmer") return `<div style="padding:12px 0;color:var(--text-secondary);text-align:center;font-weight:500;">📅 À confirmer</div>`;
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;">
                <div class="petit-lutteur" onclick="ouvrirFicheLutteur('${p.lutteur1.replace(/'/g, "\\'")}')">${getPetitPhoto(p.lutteur1)}<span class="petit-nom">${p.lutteur1}</span></div>
                <span class="petit-vs">VS</span>
                <div class="petit-lutteur" onclick="ouvrirFicheLutteur('${p.lutteur2.replace(/'/g, "\\'")}')"><span class="petit-nom">${p.lutteur2}</span>${getPetitPhoto(p.lutteur2)}</div>
            </div>`;
        }).join('');
    } else petitsHtml = '<p style="color:var(--text-secondary);text-align:center;padding:12px;">📅 À confirmer</p>';

    let commentaires = JSON.parse(localStorage.getItem(`commentaires_${combatId}`) || '[]');
    let commentairesHtml = commentaires.map(co => `
        <div class="comment-card"><div class="comment-author">${co.auteur} <span class="comment-date">${co.date}</span></div><div style="font-size:14px;color:#475569;margin-top:6px;">${co.texte}</div></div>
    `).join('') || '<p style="color:var(--text-secondary);text-align:center;">Aucun commentaire</p>';

    document.getElementById('detail-content').innerHTML = `
        <div class="detail-header"><button class="detail-back" onclick="closeDetailPage()">←</button></div>
        <div style="background:var(--gradient-hero);padding:24px 16px 28px;color:#fff;margin-bottom:8px;text-align:center;">
            <h2 style="font-size:20px;font-weight:700;margin-bottom:20px;">⚔️ COMBAT VEDETTE</h2>
            <div class="detail-combatants">
                <div class="detail-team" onclick="ouvrirFicheLutteur('${c.vedette.lutteur1.replace(/'/g, "\\'")}')">${getDetailPhoto(c.vedette.lutteur1)}<div class="detail-name">${c.vedette.lutteur1}</div><div class="detail-ecurie">${c.vedette.ecurie1||''}</div></div>
                <div class="detail-vs">VS</div>
                <div class="detail-team" onclick="ouvrirFicheLutteur('${c.vedette.lutteur2.replace(/'/g, "\\'")}')">${getDetailPhoto(c.vedette.lutteur2)}<div class="detail-name">${c.vedette.lutteur2}</div><div class="detail-ecurie">${c.vedette.ecurie2||''}</div></div>
            </div>
            <p style="margin-top:18px;font-size:15px;font-weight:500;">${formaterDate(c)} · 📍 ${c.lieu}</p>
        </div>
        <div class="detail-info"><div class="section-title">📅 Informations</div><p style="padding:6px 0;"><strong>Date :</strong> ${formaterDate(c)}</p><p style="padding:6px 0;"><strong>Lieu :</strong> ${c.lieu}</p><p style="padding:6px 0;"><strong>Type :</strong> ${c.vedette.type||'Combat classique'}</p></div>
        <div class="detail-info"><div class="section-title">🥊 Petits combats</div>${petitsHtml}</div>
        <div class="pronostics-section">
            <div class="section-title">📊 Pronostics</div>
            <div class="pronostic-bar"><div class="pronostic-nom"><span>${c.vedette.lutteur1}</span><span>${pct1}% (${pronostics.lutteur1})</span></div><div class="pronostic-track"><div class="pronostic-fill lutteur1" style="width:${pct1}%;">${pct1}%</div></div></div>
            <div class="pronostic-bar"><div class="pronostic-nom"><span>${c.vedette.lutteur2}</span><span>${pct2}% (${pronostics.lutteur2})</span></div><div class="pronostic-track"><div class="pronostic-fill lutteur2" style="width:${pct2}%;">${pct2}%</div></div></div>
            <div class="vote-buttons">
                <button class="vote-btn ${userVote==='lutteur1'?'voted':''}" onclick="voter('${combatId}','lutteur1')">👍 ${c.vedette.lutteur1}</button>
                <button class="vote-btn ${userVote==='lutteur2'?'voted':''}" onclick="voter('${combatId}','lutteur2')">👍 ${c.vedette.lutteur2}</button>
            </div>
        </div>
        <div class="commentaires-section">
            <div class="section-title">💬 Commentaires</div>
            <div class="comment-form"><input class="comment-input" id="commentInput_${combatId}" placeholder="Votre commentaire..."><button class="comment-submit" onclick="ajouterCommentaire('${combatId}')">Envoyer</button></div>
            <div id="commentairesList_${combatId}">${commentairesHtml}</div>
        </div>
        <button class="btn-primary" onclick="closeDetailPage()" style="margin:16px;width:calc(100% - 32px);">Fermer</button>
    `;
    document.getElementById('detailPage').classList.add('open');
    document.getElementById('detailPage').scrollTop = 0;
}

function voter(combatId, choix){
    let vote = localStorage.getItem(`vote_${combatId}`);
    if(vote === choix) return;
    if(vote) return;
    localStorage.setItem(`vote_${combatId}`, choix);
    let pronos = JSON.parse(localStorage.getItem(`pronostics_${combatId}`) || '{"lutteur1":0,"lutteur2":0}');
    pronos[choix] = (pronos[choix] || 0) + 1;
    localStorage.setItem(`pronostics_${combatId}`, JSON.stringify(pronos));
    let idx = parseInt(combatId.replace('combat_',''));
    openDetailPage(idx);
}

function ajouterCommentaire(combatId){
    let input = document.getElementById(`commentInput_${combatId}`);
    let texte = input.value.trim();
    if(!texte) return;
    let commentaires = JSON.parse(localStorage.getItem(`commentaires_${combatId}`) || '[]');
    commentaires.push({auteur: 'Anonyme', date: new Date().toLocaleDateString('fr-FR'), texte: texte});
    localStorage.setItem(`commentaires_${combatId}`, JSON.stringify(commentaires));

}

// ============================================================
// PULL TO REFRESH
// ============================================================
let startY = 0, currentY = 0, isPulling = false, isRefreshing = false, canPull = true;
const PULL_THRESHOLD = 80;
const refreshIndicator = document.getElementById('refreshIndicator');
const refreshContent = document.getElementById('refreshContent');

document.addEventListener('touchstart', (e) => {
    if (window.scrollY === 0 && !isRefreshing && canPull) {
        startY = e.touches[0].pageY;
        isPulling = true;
    }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
    if (!isPulling || isRefreshing) return;
    currentY = e.touches[0].pageY;
    const pullDistance = currentY - startY;
    if (pullDistance > 5 && window.scrollY === 0) {
        e.preventDefault();
        const pullHeight = Math.min(pullDistance * 0.5, 80);
        refreshIndicator.style.height = pullHeight + 'px';
        refreshIndicator.classList.add('pulling');
        refreshContent.innerHTML = pullDistance < PULL_THRESHOLD ? '⬇️ Tirer pour rafraîchir' : '✅ Relâcher pour rafraîchir';
    }
}, { passive: false });

document.addEventListener('touchend', async (e) => {
    if (!isPulling || isRefreshing) { isPulling = false; return; }
    const pullDistance = currentY - startY;
    if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        isRefreshing = true;
        canPull = false;
        refreshIndicator.style.height = '56px';
        refreshIndicator.classList.add('refreshing');
        refreshIndicator.classList.remove('pulling');
        refreshContent.innerHTML = '<div style="display:flex;align-items:center;"><div class="refresh-spinner"></div> Mise à jour...</div>';
        await rafraichirDonnees();
        refreshContent.innerHTML = '✅ Données mises à jour !';
        setTimeout(() => {
            refreshIndicator.style.height = '0';
            refreshIndicator.classList.remove('refreshing');
            isRefreshing = false;
            canPull = true;
        }, 1000);
    } else {
        refreshIndicator.style.height = '0';
        refreshIndicator.classList.remove('pulling');
    }
    isPulling = false;
    startY = 0;
    currentY = 0;
});
window.onload = function(){ chargerDonnees(); };
