<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b3d2e">
    <title>Admin · Lutte SN</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --forest: #0b3d2e;
            --forest-mid: #145c42;
            --saffron: #f5a623;
            --sand: #f9f4ec;
            --chalk: #ffffff;
            --ink: #0e1c14;
            --mist: #6b8a7a;
            --border: #dde8e0;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(11,61,46,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Barlow', sans-serif;
            background: var(--sand);
            color: var(--ink);
            padding: 16px;
            max-width: 850px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, var(--forest), var(--forest-mid));
            color: white;
            padding: 28px 24px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .admin-header::after {
            content: '🥊';
            font-size: 100px;
            position: absolute;
            right: -20px;
            bottom: -30px;
            opacity: 0.1;
        }
        .admin-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }
        .admin-header p {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            opacity: 0.75;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }

        .section {
            background: var(--chalk);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1.5px solid var(--border);
        }
        .section h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--forest);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .section h2 .badge {
            background: var(--forest-mid);
            color: white;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            font-family: 'Barlow', sans-serif;
        }

        label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: var(--mist);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 14px;
            display: block;
        }
        input, textarea, select {
            width: 100%;
            padding: 13px 16px;
            margin: 6px 0 2px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Barlow', sans-serif;
            font-size: 15px;
            background: var(--sand);
            transition: all 0.2s;
            color: var(--ink);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--forest-mid);
            background: white;
            box-shadow: 0 0 0 4px rgba(20,92,66,0.08);
        }
        textarea { min-height: 90px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn {
            background: linear-gradient(135deg, var(--forest), var(--forest-mid));
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 16px;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn-outline { background: transparent; border: 2px solid var(--forest); color: var(--forest); }
        .btn-danger { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .btn-small { width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0; display: inline-block; }
        .btn-icon {
            background: var(--sand);
            border: 1.5px solid var(--border);
            color: var(--ink);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            transition: all 0.2s;
        }
        .btn-icon:active { background: var(--border); transform: scale(0.93); }

        .item-list {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 18px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
        }
        .item-row {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: background 0.15s;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background: var(--sand); }
        .item-row strong { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: 0.3px; }
        .item-row small { color: var(--mist); font-size: 12px; display: block; margin-top: 2px; font-weight: 500; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .type-badge {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; padding: 3px 10px; border-radius: 20px;
        }
        .type-badge.vedette { background: #fef3c7; color: #b45309; }
        .type-badge.petit { background: #e0e7ff; color: #4338ca; }

        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .history-table th {
            background: #f1f5f9; font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase; letter-spacing: 1px; font-size: 11px;
            padding: 10px 8px; text-align: left; color: var(--mist);
        }
        .history-table td { padding: 8px; border-top: 1px solid var(--border); }
        .history-table input, .history-table select { margin: 0; padding: 7px 8px; font-size: 13px; }
        .delete-link { color: #c0392b; cursor: pointer; font-weight: 700; font-size: 18px; }

        .success-msg {
            background: #d1fae5; color: #065f46; padding: 14px 18px;
            border-radius: 14px; margin: 12px 0; font-weight: 600; font-size: 14px;
            display: none; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .logout-link { text-align: center; margin-top: 24px; padding: 20px; }
        .logout-link a { color: var(--mist); text-decoration: none; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>

<div class="admin-header">
    <h1>🥊 ADMIN LUTTE SN</h1>
    <p>Gestion complète · Combats · Lutteurs · Actualités · Tournois</p>
</div>

<div id="loginSection" class="section">
    <h2>🔐 Connexion</h2>
    <input type="password" id="adminPassword" placeholder="Mot de passe administrateur">
    <button class="btn" onclick="login()">Se connecter</button>
</div>

<div id="adminContent" style="display:none;">

    <!-- ==================== COMBATS ==================== -->
    <div class="section">
        <h2>🏟️ Combats <span class="badge" id="combatsCount">0</span></h2>
        <div class="item-list" id="combatsList"></div>

        <input type="hidden" id="cEditId" value="">

        <label>Type de combat</label>
        <select id="cTypeCombat" onchange="toggleCombatForm()">
            <option value="vedette">🥊 Combat Vedette</option>
            <option value="petit">🥊 Petit Combat</option>
        </select>

        <div id="parentCombatDiv" style="display:none;">
            <label>Rattaché au combat vedette</label>
            <select id="cParentCombat">
                <option value="">-- Choisir un combat vedette --</option>
            </select>
        </div>

        <div class="row">
            <div><label>📸 Photo Lutteur 1</label><input type="text" id="cPhoto1" placeholder="fichier.jpg"></div>
            <div><label>📸 Photo Lutteur 2</label><input type="text" id="cPhoto2" placeholder="fichier.jpg"></div>
        </div>

        <div class="row">
            <div><label>👤 Lutteur 1</label><input type="text" id="cL1" placeholder="Nom du lutteur 1"></div>
            <div><label>👤 Lutteur 2</label><input type="text" id="cL2" placeholder="Nom du lutteur 2"></div>
        </div>

        <div id="vedetteFields">
            <div class="row">
                <div><label>🏠 Écurie 1</label><input type="text" id="cE1" placeholder="Écurie"></div>
                <div><label>🏠 Écurie 2</label><input type="text" id="cE2" placeholder="Écurie"></div>
            </div>
            <div class="row">
                <div><label>📅 Date (YYYY-MM-JJ)</label><input type="text" id="cDate" placeholder="2026-06-15"></div>
                <div><label>📅 Jour semaine</label><input type="text" id="cJour" placeholder="Samedi"></div>
            </div>
            <div class="row">
                <div><label>📍 Lieu</label><input type="text" id="cLieu" placeholder="Stade Demba Diop, Dakar"></div>
                <div><label>🌍 International ?</label><select id="cIntl"><option value="false">Non</option><option value="true">Oui</option></select></div>
            </div>
        </div>

        <div class="row">
            <div><label>🏆 Vainqueur</label><input type="text" id="cVainqueur" placeholder="Laisser vide si pas encore"></div>
            <div><label>🎥 ID YouTube</label><input type="text" id="cVideo" placeholder="ex: dQw4w9WgXcQ"></div>
        </div>

        <button class="btn" id="btnSaveCombat" onclick="ajouterCombat()">✅ Ajouter le combat</button>
        <button class="btn btn-outline" id="btnCancelCombat" onclick="annulerEditionCombat()" style="display:none;">❌ Annuler la modification</button>
    </div>

    <!-- ==================== LUTTEURS ==================== -->
    <div class="section">
        <h2>👤 Lutteurs <span class="badge" id="lutteursCount">0</span></h2>
        <div class="item-list" id="lutteursList"></div>

        <input type="hidden" id="lOriginalNom" value="">

        <label>👤 Nom du lutteur</label>
        <input type="text" id="lNom" placeholder="Nom complet">

        <div class="row">
            <div><label>🏠 Écurie</label><input type="text" id="lEcurie" placeholder="Nom de l'écurie"></div>
            <div><label>📸 Photo</label><input type="text" id="lPhoto" placeholder="fichier dans /photos/"></div>
        </div>

        <div class="row">
            <div><label>🏆 Victoires</label><input type="number" id="lV" value="0" min="0"></div>
            <div><label>❌ Défaites</label><input type="number" id="lD" value="0" min="0"></div>
            <div><label>🤝 Nuls</label><input type="number" id="lN" value="0" min="0"></div>
            <div><label>📊 Total combats</label><input type="number" id="lT" value="0" min="0"></div>
        </div>

        <label>🎥 ID YouTube</label>
        <input type="text" id="lVideo" placeholder="ex: dQw4w9WgXcQ">

        <label style="margin-top:20px;">📋 Historique des combats</label>
        <div id="historiqueContainer" style="overflow-x:auto;">
            <p style="color:var(--mist);font-size:13px;padding:12px 0;">Aucun historique. Ajoutez des combats ci-dessous.</p>
        </div>
        <button class="btn btn-outline" onclick="ajouterLigneHistorique()" style="margin-top:8px;">+ Ajouter un combat à l'historique</button>

        <button class="btn" id="btnSaveLutteur" onclick="ajouterLutteur()">✅ Ajouter le lutteur</button>
        <button class="btn btn-outline" id="btnCancelLutteur" onclick="annulerEditionLutteur()" style="display:none;">❌ Annuler la modification</button>
    </div>

    <!-- ==================== ACTUALITÉS ==================== -->
    <div class="section">
        <h2>📰 Actualités <span class="badge" id="newsCount">0</span></h2>
        <div class="item-list" id="newsList"></div>

        <input type="hidden" id="nEditId" value="">

        <label>📌 Titre</label><input type="text" id="nTitre" placeholder="Titre de l'actualité">
        <label>📅 Date</label><input type="text" id="nDate" placeholder="5 Mai 2026">
        <label>📝 Extrait (résumé)</label><textarea id="nExtrait" placeholder="Court résumé visible dans la liste..."></textarea>
        <label>📄 Contenu complet</label><textarea id="nFull" placeholder="Texte complet de l'article..."></textarea>
        <label>🖼️ Image</label><input type="text" id="nImage" placeholder="fichier dans /images/">

        <button class="btn" id="btnSaveNews" onclick="ajouterNews()">✅ Ajouter l'actualité</button>
        <button class="btn btn-outline" id="btnCancelNews" onclick="annulerEditionNews()" style="display:none;">❌ Annuler la modification</button>
    </div>

    <!-- ==================== MBAPATT ==================== -->
    <div class="section">
        <h2>🏆 Mbapatt <span class="badge" id="mbapattCount">0</span></h2>
        <div class="item-list" id="mbapattList"></div>

        <input type="hidden" id="mEditId" value="">

        <label>🏆 Nom du tournoi</label><input type="text" id="mNom" placeholder="Mbapatt 2026">
        <div class="row">
            <div><label>📅 Date</label><input type="text" id="mDate" placeholder="Juin 2026"></div>
            <div><label>📍 Lieu</label><input type="text" id="mLieu" placeholder="Dakar"></div>
        </div>
        <label>📝 Description</label><textarea id="mDesc" placeholder="Description du tournoi..."></textarea>
        <label>👥 Participants (séparés par des virgules)</label><input type="text" id="mParts" placeholder="Balla Gaye, Bombardier, Yékini">
        <label>🖼️ Image</label><input type="text" id="mImage" placeholder="fichier dans /images/">

        <button class="btn" id="btnSaveMbapatt" onclick="ajouterMbapatt()">✅ Ajouter le tournoi</button>
        <button class="btn btn-outline" id="btnCancelMbapatt" onclick="annulerEditionMbapatt()" style="display:none;">❌ Annuler la modification</button>
    </div>

    <div class="logout-link"><a href="#" onclick="logout()">🔒 Se déconnecter</a></div>
</div>

<div class="success-msg" id="successMsg"></div>

<script>
/* ============================================================
   CONFIGURATION FIREBASE
   ============================================================ */
const firebaseConfig = {
    apiKey: "AIzaSyBzlCDXYhm-OABALXSOGaIhvrLfvJfWeJ8",
    authDomain: "lutte-sn.firebaseapp.com",
    databaseURL: "https://lutte-sn-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lutte-sn",
    storageBucket: "lutte-sn.firebasestorage.app",
    messagingSenderId: "1018458333769",
    appId: "1:1018458333769:web:a4eb3983c4e71c3cdcd598"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_PASSWORD = "lutte2026";
let currentHistorique = [];
let allVedetteCombats = [];

/* ============================================================
   AUTHENTIFICATION
   ============================================================ */
function login() {
    if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        chargerTout();
    } else { alert('❌ Mot de passe incorrect'); }
}
function logout() {
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('adminContent').style.display = 'none';
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function afficherSucces(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3500);
}
function extraireIdYoutube(url) {
    if (!url) return '';
    const m = url.match(/(?:youtu\.be\/|v\/|embed\/|watch\?v=|&v=)([^#&?]{11})/);
    return m ? m[1] : url;
}
function supprimerItem(collection, id, callback) {
    if (confirm('🗑️ Supprimer définitivement cet élément ?')) {
        db.ref(`${collection}/${id}`).remove()
            .then(() => { afficherSucces('✅ Élément supprimé'); if (callback) callback(); });
    }
}

/* ============================================================
   GESTION DU FORMULAIRE COMBAT
   ============================================================ */
function toggleCombatForm() {
    const type = document.getElementById('cTypeCombat').value;
    document.getElementById('parentCombatDiv').style.display = (type === 'petit') ? 'block' : 'none';
    document.getElementById('vedetteFields').style.display = (type === 'petit') ? 'none' : 'block';
    if (type === 'petit') chargerListeVedettePourSelect();
}

function chargerListeVedettePourSelect() {
    const select = document.getElementById('cParentCombat');
    select.innerHTML = '<option value="">-- Choisir --</option>';
    allVedetteCombats.forEach(c => {
        if (c.type !== 'petit') {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.vedette?.lutteur1 || c.lutteur1 || '?'} vs ${c.vedette?.lutteur2 || c.lutteur2 || '?'}`;
            select.appendChild(opt);
        }
    });
}

function viderFormulaireCombat() {
    document.getElementById('cEditId').value = '';
    ['cTypeCombat','cPhoto1','cPhoto2','cL1','cL2','cE1','cE2','cDate','cJour','cLieu','cVainqueur','cVideo'].forEach(id => {
        if (id === 'cTypeCombat') document.getElementById(id).value = 'vedette';
        else if (id === 'cIntl') document.getElementById(id).value = 'false';
        else document.getElementById(id).value = '';
    });
    document.getElementById('cParentCombat').value = '';
    document.getElementById('btnSaveCombat').textContent = '✅ Ajouter le combat';
    document.getElementById('btnCancelCombat').style.display = 'none';
    toggleCombatForm();
}

function annulerEditionCombat() { viderFormulaireCombat(); }

/* ============================================================
   AJOUTER / MODIFIER UN COMBAT
   ============================================================ */
function ajouterCombat() {
    const editId = document.getElementById('cEditId').value;
    const type = document.getElementById('cTypeCombat').value;
    const l1 = document.getElementById('cL1').value.trim();
    const l2 = document.getElementById('cL2').value.trim();
    if (!l1 || !l2) { alert('❌ Les deux lutteurs sont obligatoires'); return; }

    if (type === 'petit') {
        const parentId = document.getElementById('cParentCombat').value;
        if (!parentId) { alert('❌ Choisissez un combat vedette parent'); return; }
        const petitCombat = {
            lutteur1: l1, lutteur2: l2,
            vainqueur: document.getElementById('cVainqueur').value.trim(),
            videoYoutube: document.getElementById('cVideo').value.trim() ? `https://www.youtube.com/watch?v=${document.getElementById('cVideo').value.trim()}` : ''
        };
        db.ref(`combats/${parentId}/petitsCombats`).once('value', (snap) => {
            let petits = snap.val() || [];
            if (editId) {
                const idx = parseInt(editId.replace('petit_', ''));
                if (!isNaN(idx) && idx < petits.length) petits[idx] = petitCombat;
            } else { petits.push(petitCombat); }
            db.ref(`combats/${parentId}/petitsCombats`).set(petits)
                .then(() => { afficherSucces(editId ? '✅ Petit combat modifié' : '✅ Petit combat ajouté'); viderFormulaireCombat(); chargerCombats(); });
        });
        return;
    }

    const combatData = {
        type: 'vedette',
        date: document.getElementById('cDate').value.trim(),
        jourSemaine: document.getElementById('cJour').value.trim(),
        lieu: document.getElementById('cLieu').value.trim(),
        estInternational: document.getElementById('cIntl').value === 'true',
        vedette: {
            lutteur1: l1, ecurie1: document.getElementById('cE1').value.trim(),
            lutteur2: l2, ecurie2: document.getElementById('cE2').value.trim(),
            type: 'Combat classique'
        },
        petitsCombats: [],
        vainqueur: document.getElementById('cVainqueur').value.trim(),
        videoYoutube: document.getElementById('cVideo').value.trim() ? `https://www.youtube.com/watch?v=${document.getElementById('cVideo').value.trim()}` : ''
    };

    const combatId = editId || `combat_${Date.now()}`;
    const savePromise = editId
        ? db.ref(`combats/${combatId}/petitsCombats`).once('value').then(snap => {
            combatData.petitsCombats = snap.val() || [];
            return db.ref(`combats/${combatId}`).set(combatData);
          })
        : db.ref(`combats/${combatId}`).set(combatData);

    savePromise
        .then(() => { afficherSucces(editId ? '✅ Combat vedette modifié' : '✅ Combat vedette ajouté'); viderFormulaireCombat(); chargerCombats(); })
        .catch(err => alert('❌ Erreur: ' + err));
}

/* ============================================================
   CHARGER & ÉDITER LES COMBATS
   ============================================================ */
function chargerCombats() {
    db.ref('combats').on('value', (snapshot) => {
        const data = snapshot.val();
        allVedetteCombats = [];
        let html = ''; let count = 0;
        if (data) {
            Object.entries(data).forEach(([id, combat]) => {
                allVedetteCombats.push({ id, ...combat });
                const typeBadge = combat.type === 'petit' ? '<span class="type-badge petit">Petit</span>' : '<span class="type-badge vedette">Vedette</span>';
                const nom = combat.type === 'petit' ? `${combat.lutteur1 || '?'} vs ${combat.lutteur2 || '?'}` : `${combat.vedette?.lutteur1 || '?'} vs ${combat.vedette?.lutteur2 || '?'}`;
                const details = combat.type !== 'petit' ? `${combat.jourSemaine || ''} · ${combat.lieu || ''}` : 'Rattaché à un combat vedette';
                html += `<div class="item-row"><div><strong>${typeBadge} ${nom}</strong><small>${details}</small></div><div class="item-actions"><button class="btn-icon" onclick="editerCombat('${id}')" title="Modifier">✏️</button><button class="btn-icon" style="color:#c0392b;" onclick="supprimerItem('combats','${id}',chargerCombats)" title="Supprimer">🗑️</button></div></div>`;
                count++;
            });
        } else { html = '<div class="item-row" style="justify-content:center;color:var(--mist);">Aucun combat</div>'; }
        document.getElementById('combatsList').innerHTML = html;
        document.getElementById('combatsCount').textContent = count;
        chargerListeVedettePourSelect();
    });
}

function editerCombat(id) {
    const combat = allVedetteCombats.find(c => c.id === id);
    if (!combat) return;
    document.getElementById('cEditId').value = id;
    if (combat.type === 'petit') {
        document.getElementById('cTypeCombat').value = 'petit'; toggleCombatForm();
        document.getElementById('cL1').value = combat.lutteur1 || '';
        document.getElementById('cL2').value = combat.lutteur2 || '';
        document.getElementById('cVainqueur').value = combat.vainqueur || '';
        document.getElementById('cVideo').value = extraireIdYoutube(combat.videoYoutube || '');
    } else {
        document.getElementById('cTypeCombat').value = 'vedette'; toggleCombatForm();
        document.getElementById('cL1').value = combat.vedette?.lutteur1 || '';
        document.getElementById('cL2').value = combat.vedette?.lutteur2 || '';
        document.getElementById('cE1').value = combat.vedette?.ecurie1 || '';
        document.getElementById('cE2').value = combat.vedette?.ecurie2 || '';
        document.getElementById('cDate').value = combat.date || '';
        document.getElementById('cJour').value = combat.jourSemaine || '';
        document.getElementById('cLieu').value = combat.lieu || '';
        document.getElementById('cIntl').value = combat.estInternational ? 'true' : 'false';
        document.getElementById('cVainqueur').value = combat.vainqueur || '';
        document.getElementById('cVideo').value = extraireIdYoutube(combat.videoYoutube || '');
    }
    document.getElementById('btnSaveCombat').textContent = '💾 Enregistrer les modifications';
    document.getElementById('btnCancelCombat').style.display = 'block';
    window.scrollTo({ top: document.getElementById('combatsList').offsetTop - 20, behavior: 'smooth' });
}

/* ============================================================
   LUTTEURS
   ============================================================ */
function ajouterLigneHistorique() {
    currentHistorique.push({ date: '', adversaire: '', resultat: 'Victoire', details: '' });
    afficherHistorique();
}

function afficherHistorique() {
    const container = document.getElementById('historiqueContainer');
    if (!currentHistorique.length) { container.innerHTML = '<p style="color:var(--mist);font-size:13px;padding:12px 0;">Aucun historique.</p>'; return; }
    let html = '<table class="history-table"><thead><tr><th>Date</th><th>Adversaire</th><th>Résultat</th><th>Détails</th><th></th></tr></thead><tbody>';
    currentHistorique.forEach((h, i) => {
        html += `<tr>
            <td><input type="text" value="${h.date}" onchange="updateHistorique(${i},'date',this.value)" style="width:80px;"></td>
            <td><input type="text" value="${h.adversaire}" onchange="updateHistorique(${i},'adversaire',this.value)" style="width:130px;"></td>
            <td><select onchange="updateHistorique(${i},'resultat',this.value)" style="width:100px;">
                <option value="Victoire" ${h.resultat==='Victoire'?'selected':''}>Victoire</option>
                <option value="Défaite" ${h.resultat==='Défaite'?'selected':''}>Défaite</option>
                <option value="Nul" ${h.resultat==='Nul'?'selected':''}>Nul</option>
            </select></td>
            <td><input type="text" value="${h.details}" onchange="updateHistorique(${i},'details',this.value)" style="width:160px;"></td>
            <td><span class="delete-link" onclick="supprimerLigneHistorique(${i})">✕</span></td>
        </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
}

function updateHistorique(index, field, value) { currentHistorique[index][field] = value; }
function supprimerLigneHistorique(index) { currentHistorique.splice(index, 1); afficherHistorique(); }

function viderFormulaireLutteur() {
    document.getElementById('lOriginalNom').value = '';
    ['lNom','lEcurie','lPhoto','lVideo'].forEach(id => document.getElementById(id).value = '');
    ['lV','lD','lN','lT'].forEach(id => document.getElementById(id).value = 0);
    currentHistorique = []; afficherHistorique();
    document.getElementById('btnSaveLutteur').textContent = '✅ Ajouter le lutteur';
    document.getElementById('btnCancelLutteur').style.display = 'none';
}
function annulerEditionLutteur() { viderFormulaireLutteur(); }

function ajouterLutteur() {
    const nom = document.getElementById('lNom').value.trim();
    if (!nom) { alert('❌ Le nom est obligatoire'); return; }
    const lutteurData = {
        ecurie: document.getElementById('lEcurie').value.trim(),
        photo: document.getElementById('lPhoto').value.trim() ? 'photos/' + document.getElementById('lPhoto').value.trim() : '',
        victoires: parseInt(document.getElementById('lV').value) || 0,
        defaites: parseInt(document.getElementById('lD').value) || 0,
        nuls: parseInt(document.getElementById('lN').value) || 0,
        combats: parseInt(document.getElementById('lT').value) || 0,
        videoYoutube: document.getElementById('lVideo').value.trim() ? `https://www.youtube.com/watch?v=${document.getElementById('lVideo').value.trim()}` : '',
        historique: currentHistorique
    };
    const originalNom = document.getElementById('lOriginalNom').value;
    const saveNom = nom.replace(/\//g, '_');
    const savePromise = originalNom
        ? db.ref(`lutteurs/${originalNom}`).remove().then(() => db.ref(`lutteurs/${saveNom}`).set(lutteurData))
        : db.ref(`lutteurs/${saveNom}`).set(lutteurData);
    savePromise
        .then(() => { afficherSucces(originalNom ? '✅ Lutteur modifié' : '✅ Lutteur ajouté'); viderFormulaireLutteur(); chargerLutteurs(); })
        .catch(err => alert('❌ Erreur: ' + err));
}

function chargerLutteurs() {
    db.ref('lutteurs').on('value', (snapshot) => {
        const data = snapshot.val();
        let html = ''; let count = 0;
        if (data) {
            Object.keys(data).forEach(nom => {
                html += `<div class="item-row"><div><strong>${nom}</strong><small>${data[nom].ecurie || ''} · ${data[nom].victoires || 0}V/${data[nom].defaites || 0}D</small></div><div class="item-actions"><button class="btn-icon" onclick="editerLutteur('${nom.replace(/'/g,"\\'")}')" title="Modifier">✏️</button><button class="btn-icon" style="color:#c0392b;" onclick="supprimerItem('lutteurs','${nom.replace(/'/g,"\\'")}',chargerLutteurs)" title="Supprimer">🗑️</button></div></div>`;
                count++;
            });
        } else { html = '<div class="item-row" style="justify-content:center;color:var(--mist);">Aucun lutteur</div>'; }
        document.getElementById('lutteursList').innerHTML = html;
        document.getElementById('lutteursCount').textContent = count;
    });
}

function editerLutteur(nom) {
    db.ref(`lutteurs/${nom}`).once('value', (snap) => {
        const d = snap.val(); if (!d) return;
        document.getElementById('lOriginalNom').value = nom;
        document.getElementById('lNom').value = nom;
        document.getElementById('lEcurie').value = d.ecurie || '';
        document.getElementById('lPhoto').value = d.photo ? d.photo.replace('photos/', '') : '';
        document.getElementById('lV').value = d.victoires || 0;
        document.getElementById('lD').value = d.defaites || 0;
        document.getElementById('lN').value = d.nuls || 0;
        document.getElementById('lT').value = d.combats || 0;
        document.getElementById('lVideo').value = extraireIdYoutube(d.videoYoutube || '');
        currentHistorique = d.historique ? JSON.parse(JSON.stringify(d.historique)) : [];
        afficherHistorique();
        document.getElementById('btnSaveLutteur').textContent = '💾 Enregistrer les modifications';
        document.getElementById('btnCancelLutteur').style.display = 'block';
        window.scrollTo({ top: document.getElementById('lutteursList').offsetTop - 20, behavior: 'smooth' });
    });
}

function viderFormulaireNews() {
    document.getElementById('nEditId').value = '';

}

function ajouterNews() {
    const titre = document.getElementById('nTitre').value.trim();
    if (!titre) { alert('❌ Le titre est obligatoire'); return; }
    const newsData = {
        title: titre, date: document.getElementById('nDate').value.trim(),
        excerpt: document.getElementById('nExtrait').value.trim(),
        full: document.getElementById('nFull').value.trim(),

    };

function chargerNews() {
    db.ref('news').on('value', (snapshot) => {
        const data = snapshot.val();
        let html = ''; let count = 0;
        if (data) {
            Object.entries(data).forEach(([id, news]) => {
                html += `<div class="item-row"><div><strong>${news.title}</strong><small>${news.date || ''}</small></div><div class="item-actions"><button class="btn-icon" onclick="editerNews('${id}')" title="Modifier">✏️</button><button class="btn-icon" style="color:#c0392b;" onclick="supprimerItem('news','${id}',chargerNews)" title="Supprimer">🗑️</button></div></div>`;
                count++;
            });

        document.getElementById('newsCount').textContent = count;
    });

function editerNews(id) {
    db.ref(`news/${id}`).once('value', (snap) => {
        const n = snap.val(); if (!n) return;
        document.getElementById('nEditId').value = id;
        document.getElementById('nTitre').value = n.title || '';
        document.getElementById('nDate').value = n.date || '';
        document.getElementById('nExtrait').value = n.excerpt || '';
        document.getElementById('nFull').value = n.full || '';
        document.getElementById('nImage').value = n.image ? n.image.replace('images/', '') : '';
        document.getElementById('btnSaveNews').textContent = '💾 Enregistrer les modifications';
        document.getElementById('btnCancelNews').style.display = 'block';
    });
}
